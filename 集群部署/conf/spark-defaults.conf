# ============================================================================
# 文件名：spark-defaults.conf
# 路径：$SPARK_HOME/conf/spark-defaults.conf
# 说明：2 节点 / 每节点 4 GiB 的"安全默认值"。所有论文实验都在此基础上做对比。
# ============================================================================

spark.master                          yarn

# ---- 事件日志与历史服务器 ----
spark.eventLog.enabled                true
spark.eventLog.dir                    hdfs://master:9000/spark-logs
spark.history.fs.logDirectory         hdfs://master:9000/spark-logs
spark.history.ui.port                 18080

# ---- 序列化：Kryo 比 Java 序列化快 2~3 倍，是"加速比实验"的一部分 ----
spark.serializer                      org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max       256m

# ---- 资源：2 个 executor，每个 1 核 1 GB ----
spark.executor.instances              2
spark.executor.cores                  1
spark.executor.memory                 1g
spark.yarn.executor.memoryOverhead    384
spark.yarn.am.memory                  768m
spark.driver.memory                   1g
spark.driver.maxResultSize            512m

# ---- 并行度：默认 200 个分区对 4 核小集群来说过多，shuffle 写放大严重 ----
spark.sql.shuffle.partitions          8
spark.default.parallelism             4

# ---- AQE：Spark 3 的自适应执行，能自动合并小分区，小集群收益明显（可作为创新点）----
spark.sql.adaptive.enabled            true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.skewJoin.enabled   true

# ---- 失败重试：默认 4 次在演示时会反复重启，浪费时间 ----
spark.yarn.maxAppAttempts             1

# ---- 动态分配关闭：小集群开启反而导致 executor 反复申请释放 ----
spark.dynamicAllocation.enabled       false

# ---- 关闭推测执行：2 核环境下推测执行几乎只会拖慢任务 ----
spark.speculation                     false

# ---- UI ----
spark.ui.showConsoleProgress          true
